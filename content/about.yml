title: About
description: Insights into software development practices, cloud experience and continuous learning in modern technologies.

content: |
  I'm Roslan Saidi, a software engineer based in Malaysia. <br><br>

  I enjoy building APIs, servers and web apps that are fast, reliable and easy to maintain.<br><br>

  I like keeping things clean and reliable. I spend a lot of time on the backend side, setting up APIs, servers and deployments. Lately, I’ve been learning Go, just to see how far I can push my backend skills.<br><br>

  When I’m not coding, I’m probably tweaking something on my setup or chilling with some music.<br><br>

