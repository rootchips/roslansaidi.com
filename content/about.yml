title: About
description: Insights into software development practices, cloud experience and continuous learning in modern technologies.

content: |
  I'm Roslan Saidi, a software engineer based in Malaysia. <br><br>
  I enjoy building APIs, servers and web apps that are fast, reliable and easy to maintain. Most of my time goes into backend work, especially around APIs, servers, deployments and making sure everything stays clean and dependable. Lately, I’ve been learning Go to push my backend skills further and explore a different way of building systems. When I’m not coding, I’m usually tweaking my setup or just relaxing with some music.<br><br>

